{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="rd-nav">
      <a class="rd-nav__brand" href="{{ base_path }}/">{{ site.title }}</a>
      <ul class="rd-nav__links">
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}
            {% assign domain = '' %}
          {% else %}
            {% assign domain = base_path %}
          {% endif %}
          <li><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
        {% endfor %}
      </ul>
      <ul class="rd-nav__icons">
        <li id="theme-toggle"><a><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a></li>
      </ul>
    </nav>
  </div>
</div>
